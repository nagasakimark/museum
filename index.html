<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>せかい はくぶつかん</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f4efe6;
    font-family: 'Noto Sans JP', 'Noto Sans CJK JP', 'Hiragino Sans', 'Yu Gothic', Meiryo, sans-serif; color: #2c2118; }
  #app canvas { display: block; touch-action: none; }
  i { font-style: normal; font-family: 'Nunito', 'Trebuchet MS', system-ui, sans-serif; font-weight: 700; color: #2f6f9f; }
  .hud { position: fixed; z-index: 5; pointer-events: none; }
  #room { top: 10px; left: 12px; background: rgba(255,253,248,.92); border-radius: 12px; padding: 6px 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,.15); display: flex; flex-direction: column; line-height: 1.2; }
  #room b { font-size: 20px; } #room span { font-size: 14px; color: #6b4d2c; font-weight: 700; }
  #topright { top: 10px; right: 12px; display: flex; gap: 8px; align-items: flex-start; pointer-events: auto; }
  #seen { background: #fff8e3; border: 2px solid #e8c25a; border-radius: 12px; padding: 6px 12px; font-weight: 700; font-size: 15px; }
  #fs, #home { border: 0; border-radius: 12px; padding: 7px 12px; background: #6b4d2c; color: #fff; font: inherit; font-weight: 700; font-size: 14px; cursor: pointer; }
  #mapwrap { bottom: 12px; left: 12px; padding: 4px; background: rgba(255,253,248,.88); border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
  #map { display: block; border-radius: 8px; }
  #hint { bottom: 18px; left: 50%; transform: translateX(-50%); background: rgba(44,33,24,.85); color: #fff;
    padding: 8px 18px; border-radius: 999px; font-size: 16px; white-space: nowrap; }
  #hint b { background: #fff; color: #2c2118; border-radius: 5px; padding: 0 6px; margin-right: 4px; }
  #banner { top: 22%; left: 50%; transform: translate(-50%, -10px); opacity: 0; transition: .5s; text-align: center;
    background: rgba(255,253,248,.95); padding: 12px 34px; border-radius: 16px; box-shadow: 0 4px 18px rgba(0,0,0,.2); }
  #banner.show { opacity: 1; transform: translate(-50%, 0); }
  #banner b { display: block; font-size: 34px; } #banner span { font-size: 18px; font-weight: 700; color: #6b4d2c; }
  #pad { position: fixed; right: 14px; bottom: 14px; z-index: 5; display: grid; grid-template-columns: repeat(3, 48px); gap: 6px; }
  #pad button { width: 48px; height: 48px; border: 0; border-radius: 12px; background: rgba(255,253,248,.88);
    box-shadow: 0 2px 6px rgba(0,0,0,.2); font-size: 22px; cursor: pointer; touch-action: none; user-select: none; }
  #pad button:active { background: #ffe7a8; }
  #panel { position: fixed; inset: 0; z-index: 10; background: rgba(30,22,14,.55); display: flex; align-items: center; justify-content: center; }
  #panel[hidden] { display: none; }
  #card { position: relative; width: min(1080px, 94vw); height: min(540px, 90vh); background: #fffdf8; border-radius: 18px;
    box-shadow: 0 10px 40px rgba(0,0,0,.35); overflow: hidden; }
  #pbody { display: flex; height: 100%; }
  #pbody img { width: 50%; height: 100%; object-fit: contain; background: #1d1a17; flex: none; }
  .bigpic { width: 50%; height: 100%; flex: none; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 45%, color-mix(in srgb, var(--c) 35%, white), var(--c)); }
  .bigpic canvas { width: min(88%, 420px); height: auto; aspect-ratio: 1; }
  .crumb { font-size: 13px; color: #8a7350; font-weight: 700; margin-bottom: 2px; }
  .info { flex: 1; padding: 22px 26px 18px; overflow-y: auto; }
  .info h2, .ptext h2 { margin: 0; font-size: 34px; line-height: 1.2; }
  .en.big { font-family: 'Nunito', 'Trebuchet MS', system-ui, sans-serif; font-size: 26px; font-weight: 800; color: #2f6f9f; margin-bottom: 10px; }
  .row { display: flex; gap: 10px; padding: 6px 0; border-bottom: 1px dashed #e4d8c3; font-size: 17px; line-height: 1.5; }
  .row .k { flex: none; width: 150px; color: #6b4d2c; font-weight: 700; }
  .fact { background: #fff3d1; border-radius: 10px; padding: 10px 14px; font-size: 18px; line-height: 1.6; margin: 12px 0; }
  .ptext { padding: 30px 40px; font-size: 22px; line-height: 1.8; overflow-y: auto; width: 100%; }
  .ptext .en { font-weight: 800; color: #2f6f9f; font-size: 22px; }
  .status { margin-top: 6px; }
  .status .src { font-size: 13px; color: #777; margin-bottom: 2px; }
  .bar { display: flex; gap: 4px; }
  .seg { flex: 1; height: 30px; border-radius: 6px; background: var(--c); opacity: .3; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 14px; }
  .chip { display: inline-block; margin: 0 14px 2px 0; white-space: nowrap; }
  .bar.all .seg { opacity: 1; }
  .seg.on { opacity: 1; transform: scaleY(1.2); box-shadow: 0 0 0 3px #2c2118; }
  .status .label { font-weight: 800; font-size: 19px; margin-top: 8px; }
  .legend { font-size: 16px; line-height: 1.9; margin-top: 8px; }
  .legend span { display: inline-block; width: 14px; height: 14px; border-radius: 50%; margin-right: 8px; }
  .pbtn { position: absolute; border: 0; background: rgba(255,255,255,.92); border-radius: 50%; width: 44px; height: 44px;
    font-size: 22px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
  #close { top: 10px; right: 10px; } #prev { bottom: 10px; left: 10px; } #next { bottom: 10px; left: 62px; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 24px; background: #f4efe6; z-index: 20; }
</style>
</head>
<body>
<div id="app"></div>
<div id="loading">よみこみ中… Loading…</div>
<div class="hud" id="room"></div>
<div class="hud" id="topright"><div id="seen"></div><button id="home" title="Back to the lobby">🏠 ロビー</button><button id="fs" title="Full screen">⛶ 大きく</button></div>
<div class="hud" id="mapwrap"><canvas id="map" width="190" height="150"></canvas></div>
<div class="hud" id="hint" hidden></div>
<div class="hud" id="banner"></div>
<div id="pad">
  <span></span><button data-btn="arrowup" aria-label="forward">⬆</button><span></span>
  <button data-btn="arrowleft" aria-label="turn left">⟲</button><button data-btn="arrowdown" aria-label="back">⬇</button><button data-btn="arrowright" aria-label="turn right">⟳</button>
</div>
<div id="panel" hidden>
  <div id="card">
    <div id="pbody"></div>
    <button class="pbtn" id="close" aria-label="close">✕</button>
    <button class="pbtn" id="prev" aria-label="previous">◀</button>
    <button class="pbtn" id="next" aria-label="next">▶</button>
  </div>
</div>
<script type="module" src="museum.js"></script>
</body>
</html>
